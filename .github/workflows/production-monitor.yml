name: SPORTS247 production monitor

on:
  push:
    branches: [main]
  schedule:
    # Low-cost check four times daily. GitHub schedules can start late.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      incident_rehearsal:
        description: 'Test the isolated GitHub Issue alert lifecycle'
        type: choice
        required: true
        default: none
        options:
          - none
          - failure
          - recovery

permissions:
  contents: read
  issues: write

concurrency:
  group: sports247-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the merged commit to reach production
        if: github.event_name == 'push'
        env:
          SPORTS247_BASE_URL: https://sports247-three.vercel.app
          SPORTS247_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/wait-for-release.mjs
      - name: Check public production endpoints (no paid video)
        id: monitor
        env:
          SPORTS247_BASE_URL: https://sports247-three.vercel.app
          SPORTS247_MONITOR_FAIL_ON_PARTIAL: '1'
          SPORTS247_MONITOR_REPORT: temp/monitor-production.json
        run: node scripts/monitor-production.mjs
      - name: Rehearse a monitor failure after healthy production checks
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.incident_rehearsal == 'failure' }}
        run: |
          echo '::error::Synthetic failure for the isolated SPORTS247 alert rehearsal'
          exit 1
      - name: Attach failure diagnostics
        if: ${{ failure() && !(github.event_name == 'workflow_dispatch' && inputs.incident_rehearsal == 'failure' && steps.monitor.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: sports247-monitor-failure
          path: temp/monitor-production.json
          if-no-files-found: warn
          retention-days: 7
      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@v7
        env:
          SPORTS247_MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          SPORTS247_REHEARSAL_MODE: ${{ inputs.incident_rehearsal || 'none' }}
        with:
          script: |
            const { openMonitorIncident } = require('./scripts/monitor-incidents.cjs');
            await openMonitorIncident({
              github, context,
              rehearsalMode: process.env.SPORTS247_REHEARSAL_MODE,
              monitorOutcome: process.env.SPORTS247_MONITOR_OUTCOME,
            });
      - name: Resolve production incident after recovery
        if: success()
        uses: actions/github-script@v7
        env:
          SPORTS247_REHEARSAL_MODE: ${{ inputs.incident_rehearsal || 'none' }}
        with:
          script: |
            const { resolveMonitorIncidents } = require('./scripts/monitor-incidents.cjs');
            await resolveMonitorIncidents({
              github, context,
              rehearsalMode: process.env.SPORTS247_REHEARSAL_MODE,
            });
