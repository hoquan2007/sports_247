name: SPORTS247 production monitor

on:
  push:
    branches: [main]
  schedule:
    # Low-cost check four times daily. GitHub schedules can start late.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sports247-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public production endpoints (no paid video)
        env:
          SPORTS247_BASE_URL: https://sports247-three.vercel.app
          SPORTS247_MONITOR_FAIL_ON_PARTIAL: '1'
          SPORTS247_MONITOR_REPORT: temp/monitor-production.json
        run: node scripts/monitor-production.mjs
      - name: Attach failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sports247-monitor-failure
          path: temp/monitor-production.json
          if-no-files-found: warn
          retention-days: 7
      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '[SPORTS247] Production monitor failed';
            const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Production monitor failed at ${new Date().toISOString()}. [View workflow run](${link}) and its diagnostics artifact.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (incident) {
              await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Resolve production incident after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '[SPORTS247] Production monitor failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (incident) {
              const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: incident.number,
                body: `Production monitor recovered at ${new Date().toISOString()}. [View successful run](${link}).`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: 'closed' });
            }
